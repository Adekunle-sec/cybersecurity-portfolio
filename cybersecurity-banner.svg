<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="projGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="projLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <filter id="projGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#projBg)"/>
  <rect width="1200" height="300" rx="16" stroke="#1E293B" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="180" cy="80" r="110" fill="#047857" opacity="0.22" filter="url(#projGlow)"/>
  <circle cx="1020" cy="220" r="130" fill="#2563EB" opacity="0.25" filter="url(#projGlow)"/>

  <!-- Subtle Circuit / Tech Grid -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="440" y1="0" x2="440" y2="300"/>
    <line x1="560" y1="0" x2="560" y2="300"/>
    <line x1="680" y1="0" x2="680" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="920" y1="0" x2="920" y2="300"/>
    <line x1="1040" y1="0" x2="1040" y2="300"/>
    <line x1="1160" y1="0" x2="1160" y2="300"/>
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(460, 36)">
    <rect width="280" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#38BDF8"/>
    <text x="30" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">TECHNICAL CODEBASE &amp; LABS</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="125" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    CYBERSECURITY &amp; DATA ANALYTICS
  </text>

  <!-- Gradient Sub-headline -->
  <text x="600" y="168" text-anchor="middle" fill="url(#projGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', sans-serif" font-size="19" font-weight="700" letter-spacing="1.8">
    PRODUCTION INCIDENT INVESTIGATION • DETECTION LOGIC • BI MODELS
  </text>

  <!-- Accent Divider Line -->
  <line x1="280" y1="195" x2="920" y2="195" stroke="url(#projLine)" stroke-width="2"/>

  <!-- Tech Badges -->
  <g transform="translate(600, 235)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" fill="#94A3B8">
    <text x="0" y="0">
      <tspan fill="#38BDF8" font-weight="600">Sentinel &amp; Defender XDR</tspan>  •  
      <tspan fill="#10B981" font-weight="600">KQL &amp; SQL Engines</tspan>  •  
      <tspan fill="#F59E0B" font-weight="600">32,245-Row Excel Models</tspan>  •  
      <tspan fill="#818CF8" font-weight="600">Power BI &amp; Tableau</tspan>
    </text>
  </g>
</svg>